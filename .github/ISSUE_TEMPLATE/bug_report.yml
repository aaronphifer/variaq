name: Bug report
description: Report a reproducible VariaQ defect
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include a minimal command and sanitized output.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: VariaQ version/commit, Python, OS, solver, backend, and framework versions.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, tokens, private data, and unrelated records.
          required: true
